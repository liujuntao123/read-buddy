[package]
name = "readest-plus"
version = "0.1.0"
description = "Zero-embedding, chapter-first desktop AI reading companion"
edition = "2021"

[lib]
name = "readest_plus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
